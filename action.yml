name: Setup Stream CLI
description: Install the Stream CLI on the runner.
author: GetStream

inputs:
  version:
    description: "An exact version to install, such as 1.9.0. Empty installs the newest."
    default: ""
  config:
    description: "Optional overrides for the CLI's global config."
    default: ""

outputs:
  version:
    description: The installed version.

runs:
  using: node24
  main: dist/index.js
