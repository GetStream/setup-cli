name: Setup Stream CLI
description: Install the Stream CLI on the runner.
author: GetStream

inputs:
  version:
    description:
      "Exact version to install, 1.9.1 or later. Omit to install the latest."
    default: ""
  config:
    description: "Override the CLI's global config (YAML string)."
    default: ""

outputs:
  version:
    description: The installed version, such as 1.9.1.

runs:
  using: node24
  main: dist/index.js
