name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: The committed bundle is built from the source
        run: git diff --exit-code dist

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - id: setup
        uses: ./
        with:
          config: |
            dashboard_url: https://dashboard.example.com

      - name: The command is on PATH and the config is written
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          test "$(getstream --version)" = "Stream CLI $VERSION"
          case "$VERSION" in 1.*) ;; *) exit 1 ;; esac
          case "$(command -v getstream)" in "$RUNNER_TOOL_CACHE"/getstream/*) ;; *) exit 1 ;; esac
          cat ~/.stream/config.yaml
          grep -q '^dashboard_url: https://dashboard.example.com$' ~/.stream/config.yaml
          grep -q '^telemetry: off$' ~/.stream/config.yaml
          ! getstream update

      - name: Run again with another config
        uses: ./
        with:
          config: |
            telemetry: on

      - name: The second run replaced the config
        run: |
          grep -q '^telemetry: on$' ~/.stream/config.yaml
          ! grep -q 'dashboard_url' ~/.stream/config.yaml

  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: setup
        uses: ./
        with:
          version: 1.9.0

      - env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          test "$VERSION" = 1.9.0
          test "$(getstream --version)" = "Stream CLI 1.9.0"
