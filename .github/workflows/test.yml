name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: The committed bundle is built from the source
        run: git diff --exit-code dist

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: setup
        uses: ./
        with:
          config: |
            dashboard_url: https://dashboard.example.com

      - name: The command is on PATH and the config is written
        env:
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          test "$(getstream --version)" = "Stream CLI $VERSION"
          case "$VERSION" in 1.*) ;; *) exit 1 ;; esac
          case "$(command -v getstream)" in "$RUNNER_TOOL_CACHE"/getstream/*) ;; *) exit 1 ;; esac
          grep -q '^dashboard_url: https://dashboard.example.com$' ~/.stream/config.yaml
          grep -q '^telemetry: off$' ~/.stream/config.yaml
          ! getstream update

      - name: Run again with a pinned version and another config
        id: pinned
        uses: ./
        with:
          version: 1.9.0
          config: |
            dashboard_url: https://other.example.com

      - name: The second run installed the pinned version and replaced the config
        env:
          VERSION: ${{ steps.pinned.outputs.version }}
        run: |
          test "$VERSION" = 1.9.0
          test "$(getstream --version)" = "Stream CLI 1.9.0"
          grep -q '^dashboard_url: https://other.example.com$' ~/.stream/config.yaml
          grep -q '^telemetry: off$' ~/.stream/config.yaml
