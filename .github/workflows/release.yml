name: Release

# Publishing a release tagged v1.2.3 moves the major tag v1 that workflows
# reference.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "$tag is not a release tag; nothing to move"; exit 0; }
          git tag -f "${tag%%.*}" "$GITHUB_SHA"
          git push -f origin "${tag%%.*}"
